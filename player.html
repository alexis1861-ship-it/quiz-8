<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Игрок</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #fff; border-radius: 16px; padding: 30px; width: 100%; max-width: 480px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
  h1 { text-align: center; margin-bottom: 20px; color: #1a237e; font-size: 24px; }
  .input-group { margin-bottom: 15px; }
  .input-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #444; }
  .input-group input { width: 100%; padding: 12px 14px; border: 2px solid #ddd; border-radius: 10px; font-size: 18px; text-align: center; letter-spacing: 4px; }
  .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 17px; cursor: pointer; transition: all 0.2s; font-weight: 600; margin-top: 10px; }
  .btn-primary { background: #1a237e; color: #fff; }
  .btn-primary:hover { background: #283593; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { text-align: center; margin-top: 20px; padding: 15px; border-radius: 10px; font-size: 16px; }
  .status.waiting { background: #e8eaf6; color: #1a237e; }
  .status.success { background: #e8f5e9; color: #2e7d32; }
  .status.error { background: #ffebee; color: #c62828; }
  .question-text { font-size: 20px; font-weight: 600; margin-bottom: 20px; color: #333; line-height: 1.4; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn { padding: 14px; border: 2px solid #ddd; border-radius: 10px; background: #fafafa; font-size: 16px; cursor: pointer; transition: all 0.2s; text-align: left; }
  .option-btn:hover { border-color: #1a237e; background: #e8eaf6; }
  .option-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .option-btn.selected { border-color: #1a237e; background: #c5cae9; }
  .result-icon { font-size: 64px; text-align: center; margin: 20px 0; }
  .result-text { text-align: center; font-size: 20px; font-weight: 600; margin-bottom: 10px; }
  .result-sub { text-align: center; color: #666; font-size: 15px; }
  .hidden { display: none !important; }
  .player-name { text-align: center; color: #666; margin-bottom: 15px; font-size: 14px; }
</style>
</head>
<body>
<div class="card" id="app">
  <h1>🗺️ Викторина</h1>

  <div id="joinScreen">
    <div class="input-group">
      <label>Код комнаты (4 цифры)</label>
      <input type="text" id="roomCode" maxlength="4" inputmode="numeric" pattern="\d{4}" placeholder="0000">
    </div>
    <button class="btn btn-primary" id="joinBtn" onclick="joinRoom()">Войти в комнату</button>
    <div class="status waiting hidden" id="joinStatus"></div>
  </div>

  <div id="waitScreen" class="hidden">
    <div class="player-name" id="playerNameDisplay"></div>
    <div class="status waiting">⏳ Ожидаем начала вопроса...</div>
  </div>

  <div id="questionScreen" class="hidden">
    <div class="player-name" id="playerNameQ"></div>
    <div class="question-text" id="qText"></div>
    <div class="options" id="qOptions"></div>
  </div>

  <div id="resultScreen" class="hidden">
    <div class="player-name" id="playerNameR"></div>
    <div class="result-icon" id="resultIcon"></div>
    <div class="result-text" id="resultText"></div>
    <div class="result-sub" id="resultSub"></div>
  </div>

  <div id="finalScreen" class="hidden">
    <div style="text-align:center; padding:20px;">
      <h2 style="margin-bottom:15px;">Викторина завершена!</h2>
      <img src="assets/final-robot.png" alt="Робот" style="max-width:250px; border-radius:12px;" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <div style="display:none; font-size:80px;">🎉</div>
      <p style="margin-top:15px; color:#555;">Спасибо за игру!</p>
    </div>
  </div>
</div>

<script>
// ==================== CONFIG ====================
const SUPABASE_URL = 'https://utqxlzzyeovbdldkrzgf.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_ncPe5DKiQtrIbD--uKF3nA_K2dtuduQ';
// =================================================

const questions = [
  { text: "Где находится плато Путорана?", options: ["На Урале", "В Сибири", "На Дальнем Востоке", "На Кавказе"], correct: 1 },
  { text: "Где находится город Звенигород?", options: ["В Подмосковье", "В Сибири", "На Урале", "В Поволжье"], correct: 0 },
  { text: "Где находится полуостров Камчатка?", options: ["В Сибири", "На Дальнем Востоке", "На Урале", "На Севере"], correct: 1 },
  { text: "Верите ли вы, что названия городов Тюмень, Самара, Тамбов и Пенза имеют тюркское происхождение?", options: ["Верю", "Не верю"], correct: 1 },
  { text: "Где находится озеро Байкал?", options: ["На юге Сибири", "На Дальнем Востоке", "На Урале", "На Севере"], correct: 0 },
  { text: "Где находится республика Адыгея?", options: ["На Кавказе", "На Урале", "В Поволжье", "В Сибири"], correct: 0 },
  { text: "Название какой из этих рек переводится не как «...Река»?", options: ["Енисей", "Кама", "Лена", "Ишим"], correct: 3 },
  { text: "Где на карте находится озеро на полуострове Камчатка?", options: ["На Чукотке", "На северо-востоке", "В Сибири", "На Урале"], correct: 1 },
  { text: "Где находится республика Дагестан?", options: ["На Кавказе", "На Урале", "В Поволжье", "В Сибири"], correct: 0 },
  { text: "Где протекает река Волга?", options: ["В Поволжье", "В Сибири", "На Урале", "На Севере"], correct: 0 }
];

let supabase, playerName = '', roomCode = '', myVote = null, currentQ = -1;

function getOrCreateName() {
  let name = localStorage.getItem('quiz_player_name');
  if (!name) {
    name = 'Игрок-' + Math.floor(1000 + Math.random() * 9000);
    localStorage.setItem('quiz_player_name', name);
  }
  return name;
}

try {
  supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch (e) {
  alert('Ошибка подключения к Supabase');
}

async function joinRoom() {
  const code = document.getElementById('roomCode').value.trim();
  const status = document.getElementById('joinStatus');
  if (!/^\d{4}$/.test(code)) {
    status.textContent = 'Введите 4 цифры';
    status.className = 'status error';
    status.classList.remove('hidden');
    return;
  }
  playerName = getOrCreateName();
  roomCode = code;
  document.getElementById('joinBtn').disabled = true;
  try {
    const { data: session, error: se } = await supabase.from('game_sessions').select('*').eq('code', code).single();
    if (se || !session) {
      status.textContent = 'Комната не найдена';
      status.className = 'status error';
      status.classList.remove('hidden');
      document.getElementById('joinBtn').disabled = false;
      return;
    }
    const { error: pe } = await supabase.from('players').insert({ session_code: code, name: playerName, joined_at: new Date().toISOString() });
    if (pe) throw pe;
    document.getElementById('joinScreen').classList.add('hidden');
    document.getElementById('waitScreen').classList.remove('hidden');
    document.getElementById('playerNameDisplay').textContent = 'Вы: ' + playerName;
    subscribeGame(session.id);
  } catch (e) {
    status.textContent = 'Ошибка: ' + e.message;
    status.className = 'status error';
    status.classList.remove('hidden');
    document.getElementById('joinBtn').disabled = false;
  }
}

function subscribeGame(sessionId) {
  supabase.channel('game-' + sessionId)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'game_sessions', filter: 'id=eq.' + sessionId }, payload => {
      const s = payload.new;
      if (s.status === 'voting' && s.current_question !== currentQ) {
        currentQ = s.current_question;
        myVote = null;
        showQuestion(currentQ);
      } else if (s.status === 'correct' || s.status === 'wrong') {
        showPersonalResult(s.status === 'correct');
      } else if (s.status === 'finished') {
        showFinal();
      }
    })
    .subscribe();
}

function showQuestion(idx) {
  if (idx < 0 || idx >= questions.length) return;
  const q = questions[idx];
  document.getElementById('waitScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('questionScreen').classList.remove('hidden');
  document.getElementById('playerNameQ').textContent = 'Вы: ' + playerName;
  document.getElementById('qText').textContent = (idx + 1) + '. ' + q.text;
  const optsDiv = document.getElementById('qOptions');
  optsDiv.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => sendVote(i, btn);
    optsDiv.appendChild(btn);
  });
}

async function sendVote(optionIndex, btnElement) {
  if (myVote !== null) return;
  myVote = optionIndex;
  document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
  btnElement.classList.add('selected');
  try {
    await supabase.from('votes').insert({
      session_code: roomCode,
      question_index: currentQ,
      player_name: playerName,
      vote: optionIndex,
      created_at: new Date().toISOString()
    });
  } catch (e) { /* ignore */ }
}

function showPersonalResult(isMajorityCorrect) {
  const q = questions[currentQ];
  const myCorrect = (myVote === q.correct);
  document.getElementById('questionScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');
  document.getElementById('playerNameR').textContent = 'Вы: ' + playerName;
  if (myCorrect) {
    document.getElementById('resultIcon').textContent = '🎉';
    document.getElementById('resultText').textContent = 'Вы ответили верно!';
  } else {
    document.getElementById('resultIcon').textContent = '❌';
    document.getElementById('resultText').textContent = 'Вы ошиблись...';
  }
  let sub = '';
  if (myCorrect && isMajorityCorrect) sub = 'Ваше мнение совпало с большинством — правильный ответ!';
  else if (myCorrect && !isMajorityCorrect) sub = 'Вы ответили правильно, хотя большинство ошиблось.';
  else if (!myCorrect && isMajorityCorrect) sub = 'Большинство ответило правильно, но не вы.';
  else sub = 'Большинство тоже ошиблось.';
  document.getElementById('resultSub').textContent = sub;
}

function showFinal() {
  document.getElementById('questionScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('waitScreen').classList.add('hidden');
  document.getElementById('finalScreen').classList.remove('hidden');
}
</script>
</body>
</html>
